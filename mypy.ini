[mypy]
# Версия языка = версия образа (Dockerfile: python:3.11-slim).
# Расхождение проверяет tests/test_72_ci.py: проверять типы против
# языка, которого нет в проде, значит узнать о разнице на деплое.
python_version = 3.11

# telethon не поставляет py.typed/stubs — сторонние библиотеки без типов
# получают ТОЧЕЧНЫЙ override (не глобальный ignore_missing_imports:
# остальные импорты должны проверяться честно).
[mypy-telethon.*]
ignore_missing_imports = True

# Фаза 6: firebase_admin без py.typed (установлен, но без типов)
[mypy-firebase_admin.*]
ignore_missing_imports = True