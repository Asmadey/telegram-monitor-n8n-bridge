# Найдено первым же прогоном CI: `pytest -q` падал с
# ModuleNotFoundError: No module named 'app'. Локально это не проявлялось,
# потому что `python -m pytest` кладёт текущий каталог в sys.path, а голый
# `pytest` — нет. Команда из AGENTS.md §3 обязана работать как написана.
[pytest]
pythonpath = .
testpaths = tests
# Маркеры проставлены явно в каждом асинхронном тесте; strict — чтобы забытый
# маркер падал, а не молча выполнялся как синхронный и «проходил».
asyncio_mode = strict
