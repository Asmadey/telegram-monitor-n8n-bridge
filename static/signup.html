<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleton — регистрация</title>
<style>
  :root { --ink: #1b1b2b; --mute: #6b7280; --accent: #5533ff; --hairline: #e5e7eb; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: #f7f7fb;
  }
  .auth-card {
    width: 100%; max-width: 380px; margin: 24px; padding: 32px 28px;
    background: #fff; border: 1px solid var(--hairline); border-radius: 14px;
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .muted { margin: 0 0 20px; color: var(--mute); font-size: 13px; }
  label { display: block; margin-bottom: 14px; font-weight: 600; font-size: 13px; }
  input, select {
    display: block; width: 100%; margin-top: 6px; padding: 10px 12px;
    border: 1px solid var(--hairline); border-radius: 8px; font-size: 14px; background: #fff;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  button {
    width: 100%; padding: 11px; margin-top: 4px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .form-error { min-height: 20px; margin: 8px 0; color: #d33; font-size: 13px; }
  .alt-signin { margin-top: 14px; }
  .google-btn {
    background: #fff; color: var(--ink); border: 1px solid var(--hairline);
  }
  .google-btn:hover { background: #f3f4f6; opacity: 1; }
  .google-error { min-height: 18px; margin: 8px 0 0; color: #d33; font-size: 13px; }
  .links { margin: 16px 0 0; text-align: center; font-size: 13px; }
  .links a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<main class="auth-card">
  <h1>Teleton</h1>
  <p class="muted">Регистрация аккаунта</p>
  <form id="signupForm" novalidate>
    <label>Email
      <input id="email" type="email" autocomplete="username" required>
    </label>
    <label>Пароль (8–72 байта)
      <input id="password" type="password" autocomplete="new-password" required>
    </label>
    <label>Часовой пояс
      <select id="timezone">
        <option value="UTC">UTC</option>
        <option value="Europe/Moscow">Europe/Moscow</option>
        <option value="Europe/Berlin">Europe/Berlin</option>
        <option value="Asia/Almaty">Asia/Almaty</option>
        <option value="America/New_York">America/New_York</option>
      </select>
    </label>
    <p class="form-error" role="alert"></p>
    <button type="submit">Создать аккаунт</button>
  </form>
  <div class="alt-signin">
    <button type="button" id="googleSignIn" class="google-btn" hidden>
      Войти через Google
    </button>
    <p class="google-error" role="alert"></p>
  </div>
  <p class="links">Уже есть аккаунт? <a href="/login">Войти</a></p>
</main>
<script src="/static/js/auth-pages.js"></script>
</body>
</html>
