<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleton — регистрация</title>
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
<main class="auth-card">
  <h1>Teleton</h1>
  <p class="muted">Регистрация аккаунта</p>
  <form id="signupForm" novalidate>
    <label>Email
      <input id="email" type="email" autocomplete="username" required>
    </label>
    <label>Пароль (8–72 байта)
      <input id="password" type="password" autocomplete="new-password" required>
    </label>
    <label>Часовой пояс
      <select id="timezone">
        <option value="UTC">UTC</option>
        <option value="Europe/Moscow">Europe/Moscow</option>
        <option value="Europe/Berlin">Europe/Berlin</option>
        <option value="Asia/Almaty">Asia/Almaty</option>
        <option value="America/New_York">America/New_York</option>
      </select>
    </label>
    <p class="form-error" role="alert"></p>
    <button type="submit">Создать аккаунт</button>
  </form>
  <div class="alt-signin">
    <button type="button" id="googleSignIn" class="google-btn" hidden>
      Войти через Google
    </button>
    <p class="google-error" role="alert"></p>
  </div>
  <p class="links">Уже есть аккаунт? <a href="/login">Войти</a></p>
</main>
<script src="/static/js/auth-pages.js"></script>
</body>
</html>
