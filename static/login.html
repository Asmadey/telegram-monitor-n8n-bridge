<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleton — вход</title>
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
<main class="auth-card">
  <h1>Teleton</h1>
  <p class="muted">Вход в панель мониторинга</p>
  <form id="loginForm" novalidate>
    <label>Email
      <input id="email" type="email" autocomplete="username" required>
    </label>
    <label>Пароль
      <input id="password" type="password" autocomplete="current-password" required>
    </label>
    <p class="form-error" role="alert"></p>
    <button type="submit">Войти</button>
  </form>
  <div class="alt-signin">
    <button type="button" id="googleSignIn" class="google-btn" hidden>
      <svg class="google-btn-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>
      <span>Войти через Google</span>
    </button>
    <p class="google-error" role="alert"></p>
  </div>
  <p class="links"><a href="/signup">Регистрация</a>·<a href="/password-reset">Забыли пароль?</a></p>
</main>
<script src="/static/js/auth-pages.js"></script>
</body>
</html>
