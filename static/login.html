<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleton — вход</title>
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
<main class="auth-card">
  <h1>Teleton</h1>
  <p class="muted">Вход в панель мониторинга</p>
  <form id="loginForm" novalidate>
    <label>Email
      <input id="email" type="email" autocomplete="username" required>
    </label>
    <label>Пароль
      <input id="password" type="password" autocomplete="current-password" required>
    </label>
    <p class="form-error" role="alert"></p>
    <button type="submit">Войти</button>
  </form>
  <div class="alt-signin">
    <button type="button" id="googleSignIn" class="google-btn" hidden>
      Войти через Google
    </button>
    <p class="google-error" role="alert"></p>
  </div>
  <p class="links"><a href="/signup">Регистрация</a>·<a href="/password-reset">Забыли пароль?</a></p>
</main>
<script src="/static/js/auth-pages.js"></script>
</body>
</html>
