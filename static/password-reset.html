<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleton — сброс пароля</title>
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
<main class="auth-card">
  <h1>Teleton</h1>
  <p class="muted">Сброс пароля</p>

  <form id="requestResetForm" novalidate>
    <label>Email
      <input id="email" type="email" autocomplete="username" required>
    </label>
    <p class="form-error" role="alert"></p>
    <p class="form-success" role="status"></p>
    <button type="submit">Отправить ссылку</button>
  </form>

  <h2>Уже есть ссылка из письма</h2>
  <form id="confirmResetForm" novalidate>
    <input id="token" type="hidden" value="">
    <label>Новый пароль (8–72 байта)
      <input id="newPassword" type="password" autocomplete="new-password" required>
    </label>
    <p class="form-error" role="alert"></p>
    <button type="submit">Сменить пароль</button>
  </form>

  <p class="links"><a href="/login">Вернуться ко входу</a></p>
</main>
<script src="/static/js/auth-pages.js"></script>
</body>
</html>
