<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleton — сброс пароля</title>
<style>
  :root { --ink: #1b1b2b; --mute: #6b7280; --accent: #5533ff; --hairline: #e5e7eb; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: #f7f7fb;
  }
  .auth-card {
    width: 100%; max-width: 380px; margin: 24px; padding: 32px 28px;
    background: #fff; border: 1px solid var(--hairline); border-radius: 14px;
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  h2 { margin: 28px 0 12px; font-size: 15px; }
  .muted { margin: 0 0 20px; color: var(--mute); font-size: 13px; }
  label { display: block; margin-bottom: 14px; font-weight: 600; font-size: 13px; }
  input {
    display: block; width: 100%; margin-top: 6px; padding: 10px 12px;
    border: 1px solid var(--hairline); border-radius: 8px; font-size: 14px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  input[type="hidden"] { display: none; }
  button {
    width: 100%; padding: 11px; margin-top: 4px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .form-error { min-height: 20px; margin: 8px 0; color: #d33; font-size: 13px; }
  .form-success { min-height: 20px; margin: 8px 0 0; color: #008715; font-size: 13px; }
  .links { margin: 16px 0 0; text-align: center; font-size: 13px; }
  .links a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<main class="auth-card">
  <h1>Teleton</h1>
  <p class="muted">Сброс пароля</p>

  <form id="requestResetForm" novalidate>
    <label>Email
      <input id="email" type="email" autocomplete="username" required>
    </label>
    <p class="form-error" role="alert"></p>
    <p class="form-success" role="status"></p>
    <button type="submit">Отправить ссылку</button>
  </form>

  <h2>Уже есть ссылка из письма</h2>
  <form id="confirmResetForm" novalidate>
    <input id="token" type="hidden" value="">
    <label>Новый пароль (8–72 байта)
      <input id="newPassword" type="password" autocomplete="new-password" required>
    </label>
    <p class="form-error" role="alert"></p>
    <button type="submit">Сменить пароль</button>
  </form>

  <p class="links"><a href="/login">Вернуться ко входу</a></p>
</main>
<script src="/static/js/auth.js"></script>
</body>
</html>
