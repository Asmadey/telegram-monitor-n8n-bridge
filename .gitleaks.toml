# Конфигурация секрет-скана (задача 7.3). Запускается джобом secret-scan
# по всей истории git и по рабочему дереву — см. .github/workflows/ci.yml.
#
# Политика исключений. Разрешение выдаётся КОНКРЕТНОМУ значению, а не файлу
# и не правилу целиком: файл в исключениях означает, что настоящий ключ,
# добавленный в него завтра, пройдёт молча. Каждая запись ниже сопровождается
# объяснением, почему это заведомо не секрет; запись без объяснения —
# повод отклонить правку в ревью.
#
# AGENTS.md §7: проверка с узкой областью хуже отсутствующей — она даёт
# зелёный статус при живом ключе в дереве.

[extend]
# Полный набор правил gitleaks. Своих правил не добавляем: сужать набор
# ради зелёного статуса — ровно та ошибка, от которой предостерегает §7.
useDefault = true

[allowlist]
description = "Заведомо фиктивные значения из документации"

regexes = [
  # README.md, раздел «Настройка переменных окружения»: пример строки .env.
  # Значение — шестнадцатеричный алфавит, выписанный подряд дважды; настоящий
  # api_hash так выглядеть не может. Разрешено само значение, поэтому реальный
  # хеш, попавший в README, по-прежнему будет найден.
  '''abcdef0123456789abcdef0123456789''',

  # tests/test_53_integrations.py, первая версия (4 сентября 2026): фиктивные
  # ключ OpenRouter и токен бота лежали литералами и были справедливо пойманы
  # скан-гейтом — он не отличает выдуманный ключ от настоящего, и это верно.
  # В рабочем дереве значения теперь собираются в рантайме, но в истории
  # коммит остался. Разрешены сами значения, а не файл и не правило:
  # 0123456789abcdef, повторённый дважды, и алфавит подряд — настоящий ключ
  # так не выглядит. Исключение по отпечатку не годится: SHA меняется при
  # любом ребейзе, и запись молча перестанет действовать.
  '''sk-or-v1-0123456789abcdef0123456789abcdef''',
  '''123456789:AAF-abcdefghijklmnopqrstuvwxyz012345''',
]

# paths здесь намеренно пуст: исключение по пути прячет и будущие настоящие
# секреты в том же файле. Если понадобится — добавляйте regex значения.
