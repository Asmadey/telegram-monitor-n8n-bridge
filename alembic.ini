# Alembic (задача 1.4 PLAN.md).
# Реальный адрес БД НЕ живёт здесь: env.py подставляет DATABASE_URL из app.config.
[alembic]
script_location = alembic
# prepend_sys_path НЕ используется: он кладёт в sys.path ОТНОСИТЕЛЬНЫЙ путь
# ".", а другие входные точки (pytest, uvicorn) кладут абсолютный. Python
# считает их разными записями и импортирует пакет `app` ВТОРОЙ раз — со
# своими копиями модулей и своим lru_cache настроек. Найдено 4 сентября
# 2026: мейлер получал Settings с пустыми полями, хотя тест непосредственно
# перед вызовом видел заполненные. Корень добавляется в env.py, с проверкой.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S