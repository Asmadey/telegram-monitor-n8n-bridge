# Явный набор правил линтера (найдено при задаче 2.9): дефолтный набор
# ruff 0.16 расширился и начал флаговать идиоматичный FastAPI (B008:
# Depends в дефолтах аргументов — штатный паттерн FastAPI, не баг) и
# регексы охранных тестов. Дефолты между версиями плавают — фиксируем
# контракт здесь, чтобы «ruff check .» означал одно и то же всегда.
#
# Исключения ниже — только для файлов, которые в дереве есть. Разрешение не
# проверять, выданное пустому месту, не сработает и не пожалуется, а читателю
# скажет, что файл на месте: строка "server.py" прожила здесь полторы фазы
# после того, как монолит сняли задачей 7.4 (12.4).

extend-exclude = [
    "auth.py",                # одноразовый интерактивный инструмент логина Telethon
    "create_user_session.py", # аналогично
    "fetch_sample.py",
    "reader.py",
    "*.md",                   # ruff 0.16 форматирует код-блоки в markdown — не наш контракт
]

[lint]
# E4/E7/E9+F — прежний дефолт ruff; I — сортировка импортов.
# Расширенные наборы (B, UP, S, FURB) не включаем: они конфликтуют с
# идиомами FastAPI и охранительными регексами security-тестов.
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# sys.path.insert(ROOT) ДО импортов app.* — намеренный bootstrap скрипта
"scripts/migrate_sqlite_to_pg.py" = ["E402"]
# то же в alembic/env.py: корень добавляется абсолютным путём перед
# импортом моделей. Относительный prepend_sys_path из alembic.ini убран —
# он импортировал пакет app во второй раз (см. tests/test_11_config.py)
"alembic/env.py" = ["E402"]